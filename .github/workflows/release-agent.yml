name: Release PBXSense Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Read and validate Agent version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content pbxsense_agent/version.py -Raw
          if ($source -notmatch 'AGENT_VERSION\s*=\s*"([^"]+)"') {
            throw "Could not read AGENT_VERSION from pbxsense_agent/version.py"
          }
          $version = $Matches[1]
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "AGENT_VERSION '$version' is not a supported release version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=agent-v$version" >> $env:GITHUB_OUTPUT

      - name: Run test suite
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Build Linux server installer
        shell: pwsh
        run: |
          ./packaging/linux/build_release.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -OutputDir "$PWD/dist"

      - name: Generate CycloneDX dependency SBOM
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.lock
          require-hashes: true
          internal-be-careful-extra-flags: >-
            --format cyclonedx-json
            --output dist/PBXSenseAgent-${{ steps.version.outputs.version }}.cdx.json

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Sort-Object Name
          if (-not $assets) {
            throw "The release build produced no files"
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Stage immutable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download verified build assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Ensure this version has not already been published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Bump AGENT_VERSION before publishing again." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Bump AGENT_VERSION before publishing again." >&2
            exit 1
          fi

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/PBXSenseAgent-${{ needs.build.outputs.version }}-linux-source-installer.tar.gz
          sbom-path: dist/PBXSenseAgent-${{ needs.build.outputs.version }}.cdx.json

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes
